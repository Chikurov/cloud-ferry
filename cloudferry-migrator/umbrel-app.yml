manifestVersion: "2.0"
id: cloudferry-migrator
storage:
  dataRoot: data
folderAccess:
  - id: umbrel-downloads
    name: Downloads
    note: >-
      Куда сохранять файлы по умолчанию. Для больших объёмов выберите папку
      на USB-диске во втором слоте: папки в Home попадают в резервные копии,
      внешний диск — нет.
    mounts:
      - service: api
        targetPath: /downloads
      - service: rclone
        targetPath: /downloads
  - id: destination
    name: Папка для скачивания (необязательно)
    note: >-
      Если выбрали эту папку, укажите /destination в поле «На сервере».
    mounts:
      - service: api
        targetPath: /destination
        readOnly: false
      - service: rclone
        targetPath: /destination
        readOnly: false
environment:
  - name: CLOUDFERRY_TRANSFERS
    services:
      - api
    default: "8"
    options: ["2", "4", "8", "16"]
    note: >-
      Сколько файлов скачивать одновременно. 8 подходит большинству. Большее
      значение ускоряет скачивание, но облако может ограничить частоту запросов.
  - name: CF_YANDEX_CLIENT_ID
    services:
      - api
    note: >-
      Необязательно: ID своего OAuth-приложения Яндекса, чтобы входить по коду
      без ID и секрета у каждого пользователя. Создайте приложение на
      oauth.yandex.ru с доступом к Яндекс Диску; redirect URI не нужен.
  - name: CF_YANDEX_CLIENT_SECRET
    services:
      - api
    note: >-
      Секрет того же OAuth-приложения. Работает только вместе с ID. Нужен rclone
      для обновления токена и хранится в настройках приложения Umbrel. Не
      публикуйте его: если приложение заблокируют в Яндексе, вход сломается у всех.
category: files
name: Cloud Ferry
version: "0.3.2"
tagline: Скачивание файлов из облака на ваш Umbrel
description: >-
  Скачивает файлы из облака на ваш Umbrel и показывает прогресс.


  Сейчас поддерживается Яндекс Диск. Подключить его можно паролем приложения
  (нужна подписка Яндекс 360) или через своё приложение в Яндекс ID — этот
  способ работает без подписки и позволяет сверять файлы. Скоро появятся
  Google Drive, Dropbox и другие облака.


  Начните с подключения облака, затем запустите скачивание. Файлы сохраняются в
  папку, которую вы разрешили приложению в настройках umbrelOS. Из облака
  файлы только читаются: приложение ничего там не меняет и не удаляет.


  Пароли и токены хранятся только на вашем Umbrel, не попадают в резервные
  копии и не пишутся в логи. Приложение не связано с Яндексом.
releaseNotes: >-
  Исправлено зависание «Идёт скачивание» на 100 %: задание, которое движок завершил с ошибкой,
  теперь переходит в «Не удалось» с причиной и кнопкой «Повторить». Если движок долго не отвечает,
  задание помечается прерванным, а не висит вечно.

installSize: 103824896
developer: Cloud Ferry contributors
website: https://github.com/chikurov/cloud-ferry
dependencies: []
repo: https://github.com/chikurov/cloud-ferry
support: https://github.com/chikurov/cloud-ferry/issues

port: 8741
gallery: []
path: ""
icon: https://raw.githubusercontent.com/chikurov/cloud-ferry/main/icon.png

defaultUsername: ""
defaultPassword: ""

permissions:
  - STORAGE_DOWNLOADS

backupIgnore:
  - data/cache/*
  - data/run/*
  - data/rclone/rclone.conf

widgets:
  - id: progress
    type: text-with-progress
    refresh: "5s"
    endpoint: api:3000/api/widget
    link: ""
    example:
      type: text-with-progress
      link: ""
      title: Cloud Ferry
      text: "12,3 ГБ из 29 ГБ · 8,4 МБ/с"
      progressLabel: Скачивание
      progress: 0.42

submitter: Cloud Ferry contributors
# Ссылка на PR, которым пакет подаётся в официальный getumbrel/umbrel-apps.
# Community store это поле не использует; при подаче в официальный магазин
# замените значение на реальный URL pull request.
submission: "https://github.com/chikurov/cloud-ferry/pulls"
