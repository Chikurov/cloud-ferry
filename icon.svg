<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="40" y1="0" x2="472" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A86FF"/>
      <stop offset="0.5" stop-color="#2556EA"/>
      <stop offset="1" stop-color="#122C96"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 70) rotate(45) scale(360)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudFill" x1="256" y1="96" x2="256" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4ECFF"/>
    </linearGradient>
    <linearGradient id="wave" x1="120" y1="0" x2="392" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE7FF"/>
      <stop offset="1" stop-color="#4FC3FF"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <path d="M256 160 V 262 M 216 224 L 256 264 L 296 224" fill="none" stroke="#000000" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06195E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>

  <g filter="url(#shadow)">
    <g mask="url(#cut)" fill="url(#cloudFill)">
      <circle cx="256" cy="190" r="92"/>
      <circle cx="160" cy="242" r="62"/>
      <circle cx="352" cy="242" r="62"/>
      <rect x="160" y="220" width="192" height="84"/>
    </g>
  </g>

  <path d="M118 362 q 34.5 -26 69 0 t 69 0 t 69 0 t 69 0" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M164 410 q 23 -18 46 0 t 46 0 t 46 0 t 46 0" fill="none" stroke="url(#wave)" stroke-opacity="0.75" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
