<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <!--
    Cloud Ferry · служебные иконки 24×24.
    Сетка 24, stroke 1.6, круглые концы и соединения, currentColor.
    Использование: <svg class="icon"><use href="icons-24.svg#icon-cloud"/></svg>
    (для внешнего спрайта нужен сервер; для inline-вставки — скопируйте <symbol>).
    Размеры: 16 — в кнопках, строках и рядом с текстом; 20 — заголовки
    блоков, пустые состояния; 24 — только иллюстрации/hero.
  -->
  <symbol id="icon-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.2 18a4.2 4.2 0 0 1-.4-8.38A5.6 5.6 0 0 1 17.6 10.6 3.7 3.7 0 0 1 17 18H7.2Z"/>
  </symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
